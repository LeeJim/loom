services:
  gateway:
    image: cr.agentgateway.dev/agentgateway:v1.7.0
    command: ["-f", "/etc/agentgateway/config.yaml"]
    env_file:
      - path: /opt/ai-native/secrets/gateway.env
        required: false
    volumes:
      - ./gateway.yaml:/etc/agentgateway/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
